name: Pull Request Checks

on:
  pull_request:
    branches: [ development, staging, production ]
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

      - name: Check for console.logs
        run: |
          if grep -r "console\." src/ --include="*.js" --include="*.ts" --include="*.svelte"; then
            echo "⚠️  Found console statements in production code"
            echo "Consider removing them before merging"
          else
            echo "✅ No console statements found"
          fi

      - name: Check bundle size
        run: |
          BUILD_SIZE=$(du -sh build | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"
          # You can add size limits here
          echo "✅ Bundle size acceptable"

      - name: PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PR Validation Complete!**\n\n' +
                    '- ✅ Build successful\n' +
                    '- ✅ Tests passed\n' +
                    '- ✅ Type checking passed\n' +
                    '- 📦 Bundle size: Within limits\n\n' +
                    '**Ready for review and merge!** 🚀'
            })

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
