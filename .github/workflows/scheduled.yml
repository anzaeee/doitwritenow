name: Scheduled Maintenance

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    name: Weekly Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          echo "🔍 Security audit completed"
          echo "📊 Check the action logs above for any vulnerabilities"
          echo "🔗 Visit: https://github.com/${{ github.repository }}/security/dependabot"

  dependency-updates:
    name: Check Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated dependencies..."
          npm outdated || true

      - name: Create issue for outdated dependencies
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { exec } = require('child_process');
            const { promisify } = require('util');
            const execAsync = promisify(exec);

            try {
              const { stdout } = await execAsync('npm outdated --json');
              const outdated = JSON.parse(stdout);

              if (Object.keys(outdated).length > 0) {
                const body = '## 📦 Outdated Dependencies Detected\n\n' +
                           'The following dependencies have available updates:\n\n' +
                           '```\n' + JSON.stringify(outdated, null, 2) + '\n```\n\n' +
                           'Consider updating these dependencies to ensure security and performance.\n\n' +
                           '---\n*This issue was automatically created by the weekly dependency check.*';

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '📦 Weekly Dependency Update Check',
                  body: body,
                  labels: ['dependencies', 'maintenance']
                });
              }
            } catch (error) {
              console.log('No outdated dependencies or error checking:', error.message);
            }

  performance-baseline:
    name: Performance Baseline Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build metrics
        run: |
          echo "📊 Build Performance Metrics:"
          echo "- Build directory size: $(du -sh build | cut -f1)"
          echo "- Number of files: $(find build -type f | wc -l)"
          echo "- Largest files:"
          find build -type f -exec ls -lh {} \; | sort -k5 -hr | head -5

      - name: Archive performance data
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: |
            build/
          retention-days: 30

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup old artifacts
        run: |
          echo "🧹 Cleaning up old workflow artifacts..."
          echo "✅ Cleanup completed (GitHub handles this automatically)"
