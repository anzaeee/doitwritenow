stages:
  - build
  - test
  - deploy
  - regression

variables:
  NODE_VERSION: "18"
  NPM_VERSION: "9"

# Cache node_modules for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Build job - runs for all branches
build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  only:
    - production
    - staging
    - development

# Integration tests - runs only on development branch
integration_tests:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - build
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running integration tests..."
    - npm run test:integration
    - echo "Integration tests passed!"
  only:
    - development
  when: manual

# Deploy to development environment
deploy_development:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Deploying to development environment..."
    - echo "Development deployment completed!"
    - echo "Application deployed to: https://dev.doitwritenow.com"
  environment:
    name: development
    url: https://dev.doitwritenow.com
  only:
    - development
  when: manual

# Deploy to staging environment
deploy_staging:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Deploying to staging environment..."
    - echo "Running smoke tests on staging..."
    - echo "Staging deployment completed!"
    - echo "Application deployed to: https://staging.doitwritenow.com"
  environment:
    name: staging
    url: https://staging.doitwritenow.com
  only:
    - staging
  when: manual

# Deploy to production environment
deploy_production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Deploying to production environment..."
    - echo "Production deployment completed!"
    - echo "Application deployed to: https://doitwritenow.com"
  environment:
    name: production
    url: https://doitwritenow.com
  only:
    - production
  when: manual

# Regression tests - runs after production deployment
regression_tests:
  stage: regression
  image: node:${NODE_VERSION}
  dependencies:
    - build
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running regression tests..."
    - npm run regression
    - echo "Regression tests completed successfully!"
  only:
    - production
  when: manual

# Rollback job for production emergencies
rollback_production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Rolling back production to previous version..."
    - echo "Rollback completed!"
  environment:
    name: production
    url: https://doitwritenow.com
  only:
    - production
  when: manual
